name: Update profile cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build cards
        run: node scripts/build-cards.mjs
        env:
          # Add a PROFILE_TOKEN secret (a personal access token) to also count
          # private contributions; otherwise the built-in token is used.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}

      - name: Commit if changed
        run: |
          git add assets
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update profile cards"
          git push
